name: Contribution snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1e3a8a&color_dots=#ebedf0,#dbeafe,#93c5fd,#3b82f6,#1e3a8a
            dist/snake-dark.svg?palette=github-dark&color_snake=#60a5fa&color_dots=#0f1d33,#1e3a8a,#1d4ed8,#3b82f6,#93c5fd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
